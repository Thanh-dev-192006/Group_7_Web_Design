<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Theo dõi thời tiết, dự báo và chất lượng không khí AQI tại 15 thành phố Việt Nam trên bản đồ.">
    <meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1520" media="(prefers-color-scheme: dark)">
    <title>Thời tiết &amp; AQI Việt Nam</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌤️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">        <!-- chỉ C sửa: bản đồ, legend -->
    <link rel="stylesheet" href="css/forecast.css">   <!-- chỉ D sửa: biểu đồ, thẻ 7 ngày, icon -->
</head>
<body>
    <noscript><p class="app-noscript">Vui lòng bật JavaScript để xem bản đồ, thời tiết và chất lượng không khí.</p></noscript>
    <header class="app-header">
        <h1 class="app-title">Thời tiết &amp; AQI</h1>
        <p class="app-updated" id="updated-at" aria-live="polite"></p>
    </header>

    <main class="layout">
        <!-- Cột trái: chọn địa điểm + bản đồ -->
        <aside class="panel panel--sidebar">
            <label class="field">
                <span class="field__label">Địa điểm</span>
                <select id="location-select" class="field__input" disabled>
                    <option>Đang tải…</option>
                </select>
            </label>
            <div id="map" class="map state state--loading" role="region" aria-label="Bản đồ địa điểm">Đang tải bản đồ…</div>
        </aside>

        <!-- Cột phải: dữ liệu của địa điểm đang chọn -->
        <section class="content">
            <article class="panel" aria-labelledby="current-title">
                <h2 id="current-title" class="panel__title">Hiện tại</h2>
                <div id="current" class="state state--loading" aria-live="polite">Đang tải…</div>
            </article>

            <article class="panel" aria-labelledby="hourly-title">
                <h2 id="hourly-title" class="panel__title">48 giờ tới</h2>
                <div id="hourly" class="state state--loading">Đang tải…</div>
            </article>

            <article class="panel" aria-labelledby="daily-title">
                <h2 id="daily-title" class="panel__title">7 ngày tới</h2>
                <div id="daily" class="state state--loading">Đang tải…</div>
            </article>
        </section>
    </main>

    <footer class="app-footer">
        Dữ liệu thời tiết và chất lượng không khí:
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0)
        · <a href="/docs" target="_blank" rel="noopener">Tài liệu API</a>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
