$kind: http-example
request:
  url: "{{baseUrl}}/teams"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "headquarters": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "headquarters": "string",
        "id": 6513
      }
order: 1000
