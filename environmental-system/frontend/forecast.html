<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="7-day forecast with hourly temperature, rain and air quality for Vietnamese cities.">
    <meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1520" media="(prefers-color-scheme: dark)">
    <title>7-day forecast · Vietnam Weather &amp; AQI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌤️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forecast.css">
    <link rel="stylesheet" href="css/forecast-page.css">
</head>
<body>
    <noscript><p class="app-noscript">Please enable JavaScript to view the forecast.</p></noscript>
    <header class="fp-top">
        <a id="back-link" class="btn-link" href="index.html"><span aria-hidden="true">←</span> Back</a>
        <div>
            <h1 id="page-title" class="fp-title">Forecast</h1>
            <p class="fp-subtitle">7-day forecast</p>
        </div>
    </header>

    <main class="fp">
        <div id="day-nav"></div>
        <p id="day-caption" class="fp-caption" aria-live="polite"></p>
        <div id="fp-content" class="state state--loading">Loading…</div>
    </main>

    <footer class="app-footer fp-footer">
        Weather and air quality data:
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0)
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="js/forecast-page.js"></script>
</body>
</html>
