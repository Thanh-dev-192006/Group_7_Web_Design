<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track weather, forecasts and AQI air quality in 15 Vietnamese cities on a map.">
    <meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1520" media="(prefers-color-scheme: dark)">
    <title>Vietnam Weather &amp; AQI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌤️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/forecast.css">
    <link rel="stylesheet" href="css/day-sheet.css">
</head>
<body>
    <noscript><p class="app-noscript">Please enable JavaScript to view the map, weather and air quality.</p></noscript>
    <header class="app-header">
        <h1 class="app-title">Weather &amp; AQI</h1>
        <p class="app-updated" id="updated-at" aria-live="polite"></p>
    </header>

    <main class="layout">
        <aside class="panel panel--sidebar">
            <label class="field">
                <span class="field__label">Location</span>
                <select id="location-select" class="field__input" disabled>
                    <option>Loading…</option>
                </select>
            </label>
            <div id="map" class="map state state--loading" role="region" aria-label="Location map">Loading map…</div>
        </aside>

        <section class="content">
            <article class="panel" aria-labelledby="current-title">
                <h2 id="current-title" class="panel__title">Current conditions</h2>
                <div id="current" class="state state--loading" aria-live="polite">Loading…</div>
            </article>

            <article class="panel" aria-labelledby="hourly-title">
                <h2 id="hourly-title" class="panel__title">Next 48 hours</h2>
                <div id="hourly" class="state state--loading">Loading…</div>
            </article>

            <article class="panel" aria-labelledby="daily-title">
                <h2 id="daily-title" class="panel__title">Next 7 days</h2>
                <div id="daily" class="state state--loading">Loading…</div>
            </article>
        </section>
    </main>

    <footer class="app-footer">
        Weather and air quality data:
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0)
        · <a href="/docs" target="_blank" rel="noopener">API docs</a>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
